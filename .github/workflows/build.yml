name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Only the Mac build for now (GitHub Actions minutes). The Windows and Linux steps below still
        # work: add these back to build their installers too.
        #   - name: Windows
        #     os: windows-2022
        #     test: build/KitnapAnalyzerTest_artefacts/Release/KitnapAnalyzerTest.exe
        #   - name: Linux
        #     os: ubuntu-22.04
        #     test: build/KitnapAnalyzerTest_artefacts/Release/KitnapAnalyzerTest
        include:
          - name: macOS
            os: macos-14
            test: build/KitnapAnalyzerTest_artefacts/Release/KitnapAnalyzerTest

    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: echo "KITNAP_VERSION=$(sed -nE 's/^project\(KITNAP VERSION ([0-9.]+)\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libgl1-mesa-dev

      # Converting the AI models to ONNX happens while configuring and needs PyTorch.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install model conversion tools
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch
          fi
          pip install onnx onnxruntime==1.23.2 pyyaml numpy safetensors BS-RoFormer==0.4.1

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$(which python)"
          test -f build/kitnap-ai/kitnap_drums_sw.onnx
          test -f build/kitnap-ai/kitnap_drumsep5.onnx

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Kit extraction test
        shell: bash
        run: ${{ matrix.test }}

      - name: AI test (separate, split, extract)
        shell: bash
        run: |
          ${{ matrix.test }} --write-mix beat.wav
          ${{ matrix.test }} --file-ai beat.wav

      - name: AI on the GPU matches the CPU
        if: runner.os == 'macOS'
        shell: bash
        run: |
          KITNAP_ORT_LOG=1 ${{ matrix.test }} --separate beat.wav drums-gpu.wav 2>&1 | grep -iE "coreml|separated" || true
          KITNAP_CPU_ONLY=1 ${{ matrix.test }} --separate beat.wav drums-cpu.wav
          ${{ matrix.test }} --compare drums-cpu.wav drums-gpu.wav -40
          KITNAP_ORT_LOG=1 ${{ matrix.test }} --split drums-cpu.wav parts-gpu 2>&1 | grep -iE "coreml|split in" || true
          KITNAP_CPU_ONLY=1 ${{ matrix.test }} --split drums-cpu.wav parts-cpu
          for part in kick snare toms hihat cymbals; do
            ${{ matrix.test }} --compare parts-cpu/$part.wav parts-gpu/$part.wav -40
          done

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:KITNAP_VERSION" `
            "/DArtefacts=$env:GITHUB_WORKSPACE\build\KITNAP_artefacts\Release" `
            "/DAIFiles=$env:GITHUB_WORKSPACE\build\kitnap-ai" installer\windows\KITNAP.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: macOS installer
        if: runner.os == 'macOS'
        run: installer/mac/build-pkg.sh "$KITNAP_VERSION" build/KITNAP_artefacts/Release build/installer build/kitnap-ai

      - name: Linux package
        if: runner.os == 'Linux'
        run: |
          staging="KITNAP-$KITNAP_VERSION-Linux"
          mkdir -p "$staging" build/installer
          cp -R build/KITNAP_artefacts/Release/VST3 build/KITNAP_artefacts/Release/LV2 build/KITNAP_artefacts/Release/Standalone "$staging/"
          cp installer/linux/install.sh build/kitnap-ai/kitnap_drums_sw.onnx build/kitnap-ai/kitnap_drumsep5.onnx "$staging/"
          tar czf "build/installer/$staging.tar.gz" "$staging"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KITNAP-${{ matrix.name }}-Installer
          path: build/installer/*
          if-no-files-found: error

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: KITNAP-${{ matrix.name }}
          path: |
            build/KITNAP_artefacts/Release/VST3
            build/KITNAP_artefacts/Release/AU
            build/KITNAP_artefacts/Release/LV2
            build/KITNAP_artefacts/Release/Standalone
          if-no-files-found: warn

  # Pushing a tag like v0.2.0 publishes a GitHub Release with the three installers attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: KITNAP-*-Installer
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
